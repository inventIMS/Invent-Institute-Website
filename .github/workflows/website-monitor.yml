name: InventIMS Website Monitor

on:
  workflow_dispatch:

jobs:
  website-health-check:
    name: Website Health Check
    runs-on: ubuntu-latest

    env:
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

    steps:
      - name: Debug and Send Email
        run: |
          JSON_EMAILS=$(echo "$ALERT_EMAIL" | awk -F',' '{
            printf "[";
            for(i=1;i<=NF;i++){
              gsub(/^ +| +$/, "", $i);
              printf "\"%s\"", $i;
              if(i<NF) printf ",";
            }
            printf "]";
          }')

          echo "Recipients: $JSON_EMAILS"

          RESPONSE=$(curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"alerts@inventiims.in\",
              \"to\": $JSON_EMAILS,
              \"subject\": \"InventIMS Test Alert\",
              \"html\": \"<h2>Test Email</h2><p>Monitoring setup is working.</p>\"
            }")

          echo "$RESPONSE"
