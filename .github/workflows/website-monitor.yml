name: InventIMS Website Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Send Test Alert
        run: |
          RESPONSE=$(curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "alerts@inventiims.in",
              "to": ["inventims.students@gmail.com"],
              "subject": "InventIMS Monitor Test",
              "html": "<h2>Monitoring is working 🚀</h2>"
            }')

          echo "$RESPONSE"
