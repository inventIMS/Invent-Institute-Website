name: InventIMS Website Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Send Test Alert
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "onboarding@resend.dev",
              "to": ["adityajai243@gmail.com"],
              "subject": "🚨 InventIMS Test Alert",
              "html": "<h2>This is a test alert from GitHub Actions</h2><p>If you received this email, Resend is working correctly.</p>"
            }'
